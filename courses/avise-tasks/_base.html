  <style>
    /* ── ACCENT ─────────────────────────────────────────────── */
    :root {
      --color-accent:       #D4A843;
      --color-accent-hover: #BF9530;
      --color-accent-light: #FDF5E0;
      --color-accent-muted: #E0C070;
    }

    /* ── 2026 PALETTE — replaces the aged-paper warm tones ──── */
    :root {
      --color-bg:             #F4F6FB;  /* crisp cool-white, not yellowy */
      --color-bg-warm:        #EBEDF8;  /* light blue-gray for alternating modules */
      --color-bg-deep:        #E1E4F2;
      --color-text:           #1A1C38;  /* deep navy-black — richer than charcoal */
      --color-text-secondary: #4A5080;  /* cool blue-gray */
      --color-text-muted:     #8890B8;
      --color-border:         #D4D8EE;
      --color-border-light:   #E2E5F4;
      --color-surface:        #FFFFFF;
      --color-surface-warm:   #F7F9FF;  /* barely-blue white for cards */
    }

    /* ── CODE↔ENGLISH: matched line numbers ─────────────────── */
    .translation-code { counter-reset: code-ln; }

    .code-line {
      counter-increment: code-ln;
      border-radius: 3px;
      transition: background 120ms;
      padding-right: 4px;
    }
    .code-line::before {
      content: counter(code-ln);
      display: inline-block;
      min-width: 1.6em;
      margin-right: 0.7em;
      text-align: right;
      color: #6C7086;
      font-size: 0.76em;
      opacity: 0.45;
      user-select: none;
    }

    .translation-english .translation-lines { counter-reset: eng-ln; }

    .tl {
      counter-increment: eng-ln;
      border-radius: 3px;
      transition: background 120ms;
      cursor: default;
    }
    .tl::before {
      content: counter(eng-ln);
      display: inline-block;
      min-width: 1.4em;
      margin-right: 0.45em;
      font-family: var(--font-mono);
      font-size: 0.73em;
      font-weight: 700;
      color: var(--color-accent-muted);
      opacity: 0.8;
      user-select: none;
    }

    /* ── hover highlight: both sides light up together ───────── */
    .code-line.ln-active  { background: rgba(212,168,67,0.18); }
    .tl.ln-active         { background: rgba(212,168,67,0.13); }
  </style>

  <script src="main.js" defer></script>

  <!-- Line-sync hover: hovering a code line or its English pair highlights both -->
  <script defer>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.translation-block').forEach(function (block) {
        var codeLines = Array.from(block.querySelectorAll('.code-line'));
        var engLines  = Array.from(block.querySelectorAll('.tl'));
        var n = Math.min(codeLines.length, engLines.length);
        for (var i = 0; i < n; i++) {
          (function (cl, el) {
            function on()  { cl.classList.add('ln-active');    el.classList.add('ln-active');    }
            function off() { cl.classList.remove('ln-active'); el.classList.remove('ln-active'); }
            cl.addEventListener('mouseenter', on);  cl.addEventListener('mouseleave', off);
            el.addEventListener('mouseenter', on);  el.addEventListener('mouseleave', off);
          })(codeLines[i], engLines[i]);
        }
      });
    });
  </script>
